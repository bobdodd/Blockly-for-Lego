<!doctype html>
<meta charset="utf-8">
<title>hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,500;1,7..72,400&display=swap">
<style>
  :root{
    --page:#0f1418; --ink:#eef3f6; --dim:#6f7d88; --mid:#a9b8c2;
    --warm:#ffb27a; --go:#3aa05e; --stop:#d4483a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:627px;overflow:hidden}
  body{background:var(--page)}
  /* Composed at 1920 x 1003 and scaled to fit, so the type scale stays the
     one it was designed on rather than being re-guessed at small sizes. */
  .frame{
    width:1920px; height:1003px; transform:scale(.625); transform-origin:top left;
    background:var(--page); color:var(--ink);
    font-family:Literata,Georgia,serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 150px;
  }

  .said{display:flex;flex-direction:column;gap:26px;margin-bottom:96px}
  .said p{font-size:50px;font-weight:300;line-height:1.24;color:var(--dim)}
  .said p:nth-child(2){color:var(--mid);padding-left:64px}
  .said p:nth-child(3){color:var(--ink);padding-left:128px}
  .said em{font-style:italic;color:var(--warm)}
  .said p.last{
    font-size:92px; font-weight:500; line-height:1.1; color:var(--warm);
    padding-left:128px; margin-top:20px; letter-spacing:-.015em;
  }

  /* the journey, reduced to almost nothing */
  .run{margin-top:10px}
  svg{display:block;width:100%;height:auto;overflow:visible}
</style>
<body>
  <div class="frame">
  <div class="said">
    <p>The robot started curving to the left.</p>
    <p>The colour sensor is on the <em>edge of a line</em>.</p>
    <p>The colour sensor now <em>sees red</em>.</p>
    <p class="last">&ldquo;found the red square&rdquo;</p>
  </div>

  <div class="run">
    <svg viewBox="0 0 1620 90" role="img" aria-label="A line from a green square to a red one, with a robot almost at the end">
      <rect x="0" y="34" width="46" height="46" rx="6" fill="#3aa05e"/>
      <line x1="46" y1="57" x2="1574" y2="57" stroke="#31404a" stroke-width="7"/>
      <path d="M70,57 q58,-26 116,0 q58,26 116,0 q58,-26 116,0 q58,26 116,0
               q58,-26 116,0 q58,26 116,0 q58,-26 116,0 q58,26 116,0 q58,-26 116,0"
            fill="none" stroke="#62c3ea" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="3 17" opacity=".9"/>
      <rect x="1574" y="34" width="46" height="46" rx="6" fill="#d4483a"/>
      <g transform="translate(1455 57)">
        <rect x="-30" y="-27" width="11" height="54" rx="4" fill="#46555f"/>
        <rect x="-36" y="-19" width="60" height="38" rx="8" fill="#9fb0bb"/>
        <polygon points="24,-13 45,0 24,13" fill="#ffb27a"/>
      </g>
    </svg>
  </div>
  </div>
</body>
