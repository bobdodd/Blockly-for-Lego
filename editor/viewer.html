<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot view — Blockly for Lego</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body class="viewer-body">
    <header class="app-header">
      <h1>Robot view</h1>
      <p id="viewer-status" class="connection-summary" role="status" aria-live="polite">
        Starting up…
      </p>
    </header>

    <main class="viewer-layout">
      <section class="scene-panel" aria-labelledby="scene-heading">
        <h2 id="scene-heading" class="visually-hidden">The robot on its mat</h2>

        <!--
          A canvas cannot be read by a screen reader. The description beside it
          is not a fallback bolted on: it is the same sentence the student
          hears, and it is what the picture is a picture of.
        -->
        <canvas
          id="scene"
          class="scene"
          role="img"
          aria-describedby="pose"
        ></canvas>

        <p id="pose" class="pose">Waiting for the robot…</p>

        <!--
          This window has no blocks of its own. These ask the editor to run the
          program it has, so a robot on a projector can be started from beside
          it rather than by turning back to the laptop. Hidden unless the
          editor opened this window: on its own it is watching a simulator
          somebody else started, and there is no program here to run.
        -->
        <div class="scene-controls" id="run-controls" hidden>
          <button type="button" id="run">
            Run <span class="shortcut" aria-hidden="true">Ctrl+G</span>
          </button>
          <button type="button" id="stop" class="secondary" disabled>
            Stop <span class="shortcut" aria-hidden="true">Ctrl+Shift+G</span>
          </button>
        </div>

        <div class="scene-controls">
          <label>
            <input type="checkbox" id="follow-robot" checked />
            Keep the camera on the robot
          </label>
          <button type="button" id="reset-view" class="secondary">Reset the view</button>
        </div>

        <!--
          What the highlight is pointing at. It belongs beside the picture it
          annotates, not in the panel of words.
        -->
        <p id="focus-label" class="focus-label" role="status" aria-live="polite"></p>
      </section>

      <aside class="commentary-panel" aria-labelledby="commentary-heading">
        <h2 id="commentary-heading">Spoken commentary</h2>
        <p class="hint">
          Describes the mat from above, and what the robot does on it, as it
          happens. Turn the speech off and it goes to your screen reader
          instead.
        </p>

        <div class="commentary-row">
          <label class="commentary-toggle">
            <input type="checkbox" id="commentary-on" checked />
            Speak the commentary
          </label>

          <label for="commentary-voice">Voice</label>
          <select id="commentary-voice">
            <option value="">Chosen for you</option>
          </select>

          <label for="commentary-volume">Volume</label>
          <input type="range" id="commentary-volume" min="0" max="100" step="10" value="100" />
          <output id="commentary-volume-value" for="commentary-volume">100%</output>

          <button type="button" id="describe-scene" class="secondary">Describe the scene</button>
          <button type="button" id="test-voice" class="secondary">Test the voice</button>
        </div>

        <!--
          Which channel is actually carrying the words. "It is silent" and "it
          is going to your screen reader" are the same experience for anyone not
          running one, so without this the difference is invisible from outside.
        -->
        <p id="commentary-channel" class="commentary-channel"></p>

        <!--
          Where the speaker puts the words when speech is off, or when the browser
          has an engine but no voices. The transcript below is deliberately NOT a
          live region: two of them saying the same thing is worse than one.
        -->
        <p id="commentary-region" class="visually-hidden" role="status" aria-live="polite"></p>

        <ul id="commentary-transcript" class="commentary-transcript" aria-label="What has been said"></ul>
      </aside>
    </main>

    <script type="module" src="dist/viewer.js"></script>
  </body>
</html>
