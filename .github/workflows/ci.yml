name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator:
    name: Simulator tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        working-directory: spike-sim
        run: python -m pytest tests/ -q

      - name: Run the example programs
        working-directory: spike-sim
        run: |
          for program in examples/*.py; do
            echo "--- $program"
            python -m spike_sim --run "$program" --speed 200
          done

  editor:
    name: Editor tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        working-directory: editor
        run: npm ci

      - name: Check the protocol vectors are up to date
        working-directory: editor
        run: |
          python3 scripts/gen-vectors.py > /tmp/vectors.json
          diff -u test/vectors.json /tmp/vectors.json

      - name: Run tests
        working-directory: editor
        # Node 20 needs a flag for the global WebSocket the browser transport
        # uses; without it those tests skip rather than fail.
        run: |
          if [ "${{ matrix.node-version }}" = "20.x" ]; then
            node --experimental-websocket --test
          else
            npm test
          fi

      - name: Build the bundle
        working-directory: editor
        run: npm run build
